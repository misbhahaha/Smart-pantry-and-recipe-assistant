<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="refresh" content="0; url=https://smart-pantry-and-recipe-assistant-c6jnsjedabfmbrga9afsbx.streamlit.app">
    <title>Smart Pantry</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f7faf8;
        color: #17221b;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
      }

      main {
        width: min(92vw, 34rem);
        padding: 2rem;
        border: 1px solid #d7e5dc;
        border-radius: 8px;
        background: #ffffff;
        box-shadow: 0 18px 45px rgba(23, 34, 27, 0.08);
      }

      h1 {
        margin: 0 0 0.65rem;
        font-size: clamp(1.8rem, 5vw, 2.6rem);
        line-height: 1.05;
        letter-spacing: 0;
      }

      p {
        margin: 0 0 1.25rem;
        color: #52635a;
        line-height: 1.55;
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 2.75rem;
        padding: 0 1rem;
        border-radius: 6px;
        background: #166534;
        color: #ffffff;
        font-weight: 700;
        text-decoration: none;
      }

      a:focus-visible {
        outline: 3px solid #86efac;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Smart Pantry</h1>
      <p>Opening the Smart Pantry app. If the redirect does not start, use the button below.</p>
      <a href="https://smart-pantry-and-recipe-assistant-c6jnsjedabfmbrga9afsbx.streamlit.app">Open app</a>
    </main>
  </body>
</html>
